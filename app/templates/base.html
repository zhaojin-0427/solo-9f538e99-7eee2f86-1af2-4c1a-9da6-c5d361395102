<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}审计底稿抽取{% endblock %}</title>
  <style>
    :root { --blue:#1f5fbf; --red:#c0392b; --gray:#666; --line:#d9dee7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
           background:#f4f6fa; color:#1f2733; }
    header { background:var(--blue); color:#fff; padding:16px 28px; }
    header h1 { margin:0; font-size:20px; }
    main { max-width:1080px; margin:24px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px;
            padding:22px 26px; margin-bottom:20px; }
    h2 { font-size:17px; margin:0 0 14px; }
    table { border-collapse:collapse; width:100%; font-size:14px; }
    th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; }
    th { background:#eef2f8; }
    input[type=text], select { padding:7px 9px; border:1px solid var(--line);
            border-radius:6px; font-size:14px; width:100%; }
    button, .btn { display:inline-block; background:var(--blue); color:#fff; border:0;
            border-radius:7px; padding:9px 18px; font-size:14px; cursor:pointer;
            text-decoration:none; }
    button.gray { background:#5b6b82; }
    button.danger { background:var(--red); padding:6px 12px; }
    .error-box { background:#fdecea; border:1px solid #f5c6c0; color:var(--red);
            border-radius:8px; padding:12px 16px; margin-bottom:16px; white-space:pre-wrap; }
    .ok-box { background:#eafaf1; border:1px solid #b7e4c7; color:#1e7e46;
            border-radius:8px; padding:12px 16px; margin-bottom:16px; }
    .muted { color:var(--gray); font-size:13px; }
    .tag { display:inline-block; background:#eef2f8; border-radius:5px; padding:2px 8px;
            font-size:12px; margin-right:6px; }
    .chain { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .row-actions { width:70px; text-align:center; }
    .hint { background:#f8fafc; border:1px dashed var(--line); border-radius:8px;
            padding:10px 14px; font-size:13px; color:var(--gray); margin-bottom:14px; }
  </style>
</head>
<body>
<header><h1>审计底稿可复算件抽取</h1></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
