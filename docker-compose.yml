services:
  audit-extract:
    build: .
    image: audit-extract:latest
    container_name: audit-extract
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "change-me-in-production"
    volumes:
      # 整个实例目录入卷：底稿、各次提交产物与持久化 SECRET_KEY 均在重启后保留
      - audit-instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  audit-instance:
